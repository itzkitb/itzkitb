<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#99c9a5">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>tupid ⚬ redirect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/s/global.css">
    <link rel="stylesheet" href="/s/pastebin.css">
</head>
<body>
    <header>
        <a href="/" class="brand unselectable">tupid</a>
    </header>

    <main>
        <div class="container">
            <div class="redirect-message">
                redirect to https://discord.gg/uJthAzqRfV
            </div>
            <div style="margin-top: 20px; font-size: 0.9rem;">
                didn't redirect? <a href="https://discord.gg/uJthAzqRfV" class="redirect-link">click me</a>
            </div>
        </div>
    </main>

    <script>
        (function () {
            const targetUrl = 'https://discord.gg/uJthAzqRfV';
            window.location.replace(targetUrl);

            // Fallback redirect if JS fails
            setTimeout(() => {
                window.location.replace(targetUrl);
            }, 3500);
        })();
    </script>
</body>
</html>
