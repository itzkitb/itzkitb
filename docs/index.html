<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tupid</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/s/terminal.css">
</head>
<body>
    <div id="terminal">
        <div id="header">
            tupid console ⚬ version 1.2.0<br>
            (c) 2026 itzkitb<br><br>
            <div class="system-msg">[silly]: under maintenance. will be restored soon... probably...</div>
        </div>

        <div id="history"></div>

        <div class="input-container" id="terminal-bottom">
            <span class="prompt">sillydev@tupid:~$&nbsp;</span>
            <div id="display-wrapper"><span id="before-cursor"></span><span id="cursor">&nbsp;</span><span id="after-cursor"></span></div>
        </div>
    </div>

    <input type="text" id="hidden-input" autofocus autocomplete="off" spellcheck="false">

    <script src="/js/terminal.js"></script>
</body>
</html>
