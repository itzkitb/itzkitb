<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avito OAuth Callback</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <style>
        
        :root {
            --bg-color: #000000;
            --main-color: #d1d1d1;
            --accent-color: #ff8f5c;
            --success-color: #5cff8f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: "Source Code Pro", monospace;
            padding: 20px;
            margin: 0;
            line-height: 1.5;
        }

        .terminal-window {
            margin: 0 auto;
        }

        .header {
            color: var(--accent-color);
            padding-bottom: 10px;
        }

        .log-line {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .success { color: var(--success-color); }
        .info { color: var(--main-color); }
        .param { color: var(--accent-color); }
        
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: var(--accent-color);
            animation: blink 1s steps(1) infinite;
            vertical-align: middle;
            margin-left: 4px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    
    </style>
</head>
<body>

    <div class="terminal-window">
        <div class="header">
            Tupid.lol ▹ Avito OAuth Callback Handler<br>
            Copyright (C) 2026 SillyApps (aka. ItzKITb)
        </div>

        <div id="output"></div>
        <div class="log-line"><span class="prompt">sillydev@TupidLol:~/oauth$</span> <span class="cursor"></span></div>
    </div>

    <script>
        const output = document.getElementById('output');

        function printLine(text, className = 'info') {
            const line = document.createElement('div');
            line.className = `log-line ${className}`;
            line.textContent = text;
            output.appendChild(line);
        }

        function parseOAuthCallback() {
            printLine("◇ Initializing...", "info");
            
            const urlParams = new URLSearchParams(window.location.search);
            const params = {};
            urlParams.forEach((value, key) => {
                params[key] = value;
            });

            if (Object.keys(params).length === 0) {
                printLine("• No URL parameters detected", "info");
                printLine("◇ Endpoint is active and valid", "success");
            } else {
                printLine("• Detected authorization response:", "info");
                for (const [key, value] of Object.entries(params)) {
                    const displayValue = key.toLowerCase().includes('token') || key.toLowerCase().includes('code') 
                        ? value.substring(0, 10) + '...' + value.substring(value.length - 4)
                        : value;
                    printLine(`▹ ${key}: ${displayValue}`, "param");
                }
                printLine("◇ Callback processed successfully.", "success");
            }

            printLine("▲ You may close this window", "info");
        }

        setTimeout(parseOAuthCallback, 300);
    </script>
</body>
</html>
