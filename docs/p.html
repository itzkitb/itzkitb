<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#99c9a5">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>tupid ⚬ pastebin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #212422;
            --text-color: #d1d1d1;
            --accent-color: #99c9a5;
            --container-bg: #2f3d33;
			--shadow: rgba(33, 36, 34, 0.4);
			--tr-even: rgba(92, 255, 146, 0.05);
            --border-width: 2px;
            --spacing-unit: 20px;
        }

        * {
            box-sizing: border-box;
			scrollbar-width: auto;
            scrollbar-color: var(--container-bg) var(--accent-color);
        }
        
        .unselectable {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        body {
            font-family: "Source Code Pro", monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

		/* ><> scrollbar */
        ::-webkit-scrollbar {
            width: 15px;
            height: 15px;
        }

        ::-webkit-scrollbar-track {
            background: var(--container-bg);
        }

        ::-webkit-scrollbar-thumb {
            background-color: var(--container-bg);
            border-radius: 0px;
            border: 5px solid var(--container-bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--container-bg);
        }

        /* ><> header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-unit);
            border-bottom: var(--border-width) solid var(--accent-color);
        }

        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
        }

        .brand:hover {
            text-decoration: underline;
        }

        .btn {
            background: transparent;
            color: var(--accent-color);
            border: var(--border-width) solid var(--accent-color);
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
            margin-left: 10px;
        }

        .btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            border-color: var(--text-color);
            color: var(--text-color);
        }

        .btn-secondary:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        /* ><> toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-color);
            color: var(--bg-color);
            padding: 12px 24px;
            border: var(--border-width) solid var(--accent-color);
            font-weight: bold;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            bottom: 40px;
        }

        /* ><> main */
        main {
            flex: 1;
            padding: var(--spacing-unit);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            border: var(--border-width) solid var(--accent-color);
            padding: 40px;
        }

        /* ><> editor */
        .editor-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .editor-textarea {
            width: 100%;
            min-height: 400px;
            background-color: var(--container-bg);
            color: var(--text-color);
            border: var(--border-width) solid var(--accent-color);
            padding: 15px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            outline: none;
        }

        .editor-textarea:focus {
            box-shadow: 0 0 8px var(--shadow);
        }

        /* ><> util */
        .error-msg {
            color: var(--accent-color);
            border: var(--border-width) solid var(--accent-color);
            padding: 15px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: var(--text-color);
            font-style: italic;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* ><> markdown */
        .markdown-body {
            color: var(--text-color);
        }

        .markdown-body a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px solid var(--accent-color);
        }

        .markdown-body a:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .markdown-body h1, 
        .markdown-body h2, 
        .markdown-body h3 {
            color: var(--accent-color);
            border-bottom: 1px solid var(--text-color);
            padding-bottom: 10px;
            margin-top: 30px;
        }

        .markdown-body code {
            background-color: var(--container-bg);
            color: var(--accent-color);
            padding: 2px 6px;
            border: 1px solid var(--accent-color);
        }

        .markdown-body pre {
            background-color: var(--container-bg);
            border: var(--border-width) solid var(--accent-color);
            padding: 15px;
            overflow: auto;
        }

        .markdown-body pre code {
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text-color);
        }

        .markdown-body blockquote {
            border-left: 4px solid var(--accent-color);
            color: var(--text-color);
            margin-left: 0;
            background: var(--container-bg);
            padding: 10px;
        }

        .markdown-body blockquote p {
            margin: 0px;
        }

        /* ><> image */
        .markdown-body img {
            max-width: 100%;
            height: auto;
            border: var(--border-width) solid var(--accent-color);
            display: block;
            margin: 20px 0;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .markdown-body img:hover {
            opacity: 0.8;
        }

        .markdown-body figure {
            margin: 20px 0;
            text-align: center;
        }

        /* ><> table */
        .markdown-body .table-container {
            width: 100%;
            overflow-x: auto;
            margin: 10px 0;
            border: var(--border-width) solid var(--accent-color);
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid var(--accent-color);
            padding: 12px 16px;
            text-align: left;
            overflow-wrap: normal;
            word-break: normal;
            min-width: 120px;
        }

        .markdown-body th {
            background-color: var(--container-bg);
            color: var(--accent-color);
            font-weight: bold;
            border-bottom: var(--border-width) solid var(--accent-color);
        }

        .markdown-body tr:nth-child(even) {
            background-color: var(--tr-even);
        }

        /* ><> lightbox */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            border: var(--border-width) solid var(--accent-color);
            cursor: pointer;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: var(--accent-color);
            font-size: 2rem;
            cursor: pointer;
            border: var(--border-width) solid var(--accent-color);
            padding: 5px 15px;
            background: transparent;
            font-family: inherit;
        }

        .lightbox-close:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        /* ><> responsive */
        @media (max-width: 600px) {
            header {
                gap: 15px;
            }
            
            .container {
                padding: 20px;
            }
            
            .btn {
                padding: 8px 12px;
                margin-left: 5px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand unselectable">tupid</a>
        <div>
            <!-- view -->
            <button id="newBtn" class="btn unselectable">new</button>
            <button id="shareBtn" class="btn unselectable">share</button>
            <button id="copyBtn" class="btn unselectable">copy</button>

            <!-- edit -->
            <button id="saveBtn" class="btn unselectable hidden">publish</button>
            <button id="cancelBtn" class="btn btn-secondary unselectable hidden">cancel</button>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="error-box" class="error-msg"></div>
            <div id="loading" class="loading hidden">loading...</div>
            
            <!-- view -->
            <div id="view-section">
                <div id="content" class="markdown-body"></div>
            </div>

            <!-- edit -->
            <div id="edit-section" class="editor-container hidden">
                <textarea id="editorTextarea" class="editor-textarea" placeholder="type your markdown content here..."></textarea>
            </div>
        </div>
    </main>

    <!-- lightbox -->
    <div id="lightbox" class="lightbox unselectable">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <img id="lightboxImg" src="" alt="Full size image">
    </div>

    <div id="toast" class="toast unselectable">copied!</div>

    <script>
        const CONFIG = {
            apiBaseUrl: 'https://api.tupid.lol/pb/', 
            homeUrl: '/'
        };

        // ><> marked.js
        const renderer = new marked.Renderer();
        renderer.image = function({ href, title, text }) {
            const titleAttr = title ? ` title="${title}"` : '';
            const altText = text || '';
            return `
                <figure>
                    <img src="${href}" alt="${altText}"${titleAttr} onclick="openLightbox(this.src)">
                </figure>
            `;
        };
		
		        // Адаптивная обертка для таблиц с поддержкой новых версий marked.js
        renderer.table = function(token) {
            let headerHtml = '';
            let bodyHtml = '';

            // Собираем шапку таблицы
            if (token.header && token.header.length > 0) {
                headerHtml += '<tr>';
                token.header.forEach(cell => {
                    headerHtml += `<th>${marked.parseInline(cell.text)}</th>`;
                });
                headerHtml += '</tr>';
            }

            // Собираем строки таблицы
            if (token.rows && token.rows.length > 0) {
                token.rows.forEach(row => {
                    bodyHtml += '<tr>';
                    row.forEach(cell => {
                        bodyHtml += `<td>${marked.parseInline(cell.text)}</td>`;
                    });
                    bodyHtml += '</tr>';
                });
            }

            return `
                <div class="table-container">
                    <table>
                        <thead>${headerHtml}</thead>
                        <tbody>${bodyHtml}</tbody>
                    </table>
                </div>
            `;
        };

        marked.setOptions({
            renderer: renderer,
            breaks: true,
            gfm: true
        });

        // ><> lightbox
        window.openLightbox = function(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        };

        window.closeLightbox = function() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        };

        document.addEventListener('DOMContentLoaded', () => {
            const contentDiv = document.getElementById('content');
            const errorBox = document.getElementById('error-box');
            const loadingDiv = document.getElementById('loading');
            
            const viewSection = document.getElementById('view-section');
            const editSection = document.getElementById('edit-section');
            const editorTextarea = document.getElementById('editorTextarea');

            const shareBtn = document.getElementById('shareBtn');
            const copyBtn = document.getElementById('copyBtn');
            const newBtn = document.getElementById('newBtn');
            const saveBtn = document.getElementById('saveBtn');
            const cancelBtn = document.getElementById('cancelBtn');

            const toast = document.getElementById('toast');
            const lightbox = document.getElementById('lightbox');
            const lightboxClose = document.getElementById('lightboxClose');
            
            let markdownContent = "";
            let currentDocId = null;

            // events
            shareBtn.addEventListener('click', handleShare);
            copyBtn.addEventListener('click', handleCopy);
            newBtn.addEventListener('click', () => setMode('edit'));
            cancelBtn.addEventListener('click', handleCancelEdit);
            saveBtn.addEventListener('click', handlePublish);
            lightboxClose.addEventListener('click', closeLightbox);

            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                    closeLightbox();
                }
            });

            // --> init(); <--
            init();

            async function init() {
                const urlParams = new URLSearchParams(window.location.search);
                currentDocId = urlParams.get('f') || urlParams.get('i');

                if (currentDocId) {
                    await fetchDocument(currentDocId);
                } else {
                    setMode('edit');
                }
            }

            async function fetchDocument(id) {
                clearError();
                showLoading(true);

                try {
                    const response = await fetch(`${CONFIG.apiBaseUrl}${encodeURIComponent(id)}`);
                    
                    if (!response.ok) {
                        if (response.status === 404) {
                            showError('oops... paste not found on server');
                            return;
                        }
                        throw new Error(`server returned HTTP ${response.status}`);
                    }

                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        const json = await response.json();
                        markdownContent = json.content || json.data || '';
                    } else {
                        markdownContent = await response.text();
                    }

                    contentDiv.innerHTML = marked.parse(markdownContent);
                    setMode('view');
                } catch (err) {
                    console.error(err);
                    showError(`failed to load paste: ${err.message}`);
                } finally {
                    showLoading(false);
                }
            }

            async function handlePublish() {
                const textToPublish = editorTextarea.value.trim();

                if (!textToPublish) {
                    showError('paste content cannot be empty!');
                    return;
                }

                clearError();
                showLoading(true);

                try {
                    const response = await fetch(`${CONFIG.apiBaseUrl}create`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ text: textToPublish })
                    });

                    if (!response.ok) {
                        throw new Error(`publish failed with status ${response.status}`);
                    }

                    const result = await response.json();
                    const newId = result.id;
                    
                    if (newId) {
                        const newUrl = `${window.location.pathname}?i=${encodeURIComponent(newId)}`;
                        window.history.pushState({ path: newUrl }, '', newUrl);
                        currentDocId = newId;
                    }

                    markdownContent = textToPublish;
                    contentDiv.innerHTML = marked.parse(markdownContent);
                    setMode('view');
                    showToast('published successfully!');
                } catch (err) {
                    console.error(err);
                    showError(`failed to publish: ${err.message}`);
                } finally {
                    showLoading(false);
                }
            }

            function setMode(mode) {
                clearError();
                if (mode === 'edit') {
                    viewSection.classList.add('hidden');
                    editSection.classList.remove('hidden');
                    
                    shareBtn.classList.add('hidden');
                    copyBtn.classList.add('hidden');
                    newBtn.classList.add('hidden');

                    saveBtn.classList.remove('hidden');
                    cancelBtn.classList.remove('hidden');

                    editorTextarea.value = markdownContent;
                    editorTextarea.focus();
                } else {
                    editSection.classList.add('hidden');
                    viewSection.classList.remove('hidden');

                    shareBtn.classList.remove('hidden');
                    copyBtn.classList.remove('hidden');
                    newBtn.classList.remove('hidden');

                    saveBtn.classList.add('hidden');
                    cancelBtn.classList.add('hidden');
                }
            }

            function handleCancelEdit() {
                if (currentDocId && markdownContent) {
                    setMode('view');
                } else {
                    editorTextarea.value = '';
                    clearError();
                }
            }

            function showError(message) {
                showLoading(false);
                errorBox.textContent = message;
                errorBox.style.display = 'block';
            }

            function clearError() {
                errorBox.textContent = '';
                errorBox.style.display = 'none';
            }

            function showLoading(show) {
                loadingDiv.classList.toggle('hidden', !show);
            }

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }

            function handleShare() {
                copyData(window.location.href, 'link copied!');
            }

            function handleCopy() {
                copyData(markdownContent, 'content copied!');
            }

            function copyData(text, successMessage) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(successMessage);
                    }).catch(() => {
                        copyWithTextarea(text, successMessage);
                    });
                } else {
                    copyWithTextarea(text, successMessage);
                }
            }

            function copyWithTextarea(text, successMessage) {
                const textarea = document.createElement("textarea");
                textarea.style.position = "absolute";
                textarea.style.left = "-9999px";
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                
                try {
                    if (document.execCommand('copy')) {
                        showToast(successMessage);
                    } else {
                        showToast('copy failed');
                    }
                } catch (err) {
                    showToast('copy failed');
                }
                document.body.removeChild(textarea);
            }
        });
    </script>
</body>
</html>
