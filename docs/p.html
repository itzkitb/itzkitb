<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#99c9a5">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>tupid ⚬ pastebin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/s/global.css">
    <link rel="stylesheet" href="/s/pastebin.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <a href="/" class="brand unselectable">tupid</a>
        <div>
            <!-- view -->
            <button id="newBtn" class="btn unselectable">new</button>
            <button id="shareBtn" class="btn unselectable">share</button>
            <button id="copyBtn" class="btn unselectable">copy</button>

            <!-- edit -->
            <button id="saveBtn" class="btn unselectable hidden">publish</button>
            <button id="cancelBtn" class="btn btn-secondary unselectable hidden">cancel</button>
        </div>
    </header>

    <main>
        <div class="container">
            <div id="error-box" class="error-msg"></div>
            <div id="loading" class="loading hidden">loading...</div>
            
            <!-- view -->
            <div id="view-section">
                <div id="content" class="markdown-body"></div>
            </div>

            <!-- edit -->
            <div id="edit-section" class="editor-container hidden">
                <textarea id="editorTextarea" class="editor-textarea" placeholder="type your markdown content here..."></textarea>
            </div>
        </div>
    </main>

    <!-- lightbox -->
    <div id="lightbox" class="lightbox unselectable">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <img id="lightboxImg" src="" alt="Full size image">
    </div>

    <div id="toast" class="toast unselectable">copied!</div>

    <script src="/js/pastebin.js"></script>
</body>
</html>
